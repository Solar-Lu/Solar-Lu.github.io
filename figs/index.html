<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Photos</title>
    <style>
      :root {
        --bg: #06070b;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-strong: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --muted2: rgba(255, 255, 255, 0.52);
        --border: rgba(255, 255, 255, 0.14);
        --accent: #8be9fd;
        --accent2: #ff79c6;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        --radius: 18px;
        --max: 1100px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: rgba(0, 0, 0, 0.04);
          --panel-strong: rgba(0, 0, 0, 0.06);
          --text: rgba(0, 0, 0, 0.9);
          --muted: rgba(0, 0, 0, 0.62);
          --muted2: rgba(0, 0, 0, 0.45);
          --border: rgba(0, 0, 0, 0.12);
          --accent: #2563eb;
          --accent2: #db2777;
          --shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
        }
      }

      [data-theme="dark"] {
        --bg: #06070b;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-strong: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --muted2: rgba(255, 255, 255, 0.52);
        --border: rgba(255, 255, 255, 0.14);
        --accent: #8be9fd;
        --accent2: #ff79c6;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      [data-theme="light"] {
        --bg: #f6f7fb;
        --panel: rgba(0, 0, 0, 0.04);
        --panel-strong: rgba(0, 0, 0, 0.06);
        --text: rgba(0, 0, 0, 0.9);
        --muted: rgba(0, 0, 0, 0.62);
        --muted2: rgba(0, 0, 0, 0.45);
        --border: rgba(0, 0, 0, 0.12);
        --accent: #2563eb;
        --accent2: #db2777;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(
            1200px 600px at 30% 10%,
            color-mix(in srgb, var(--accent) 16%, transparent),
            transparent 55%
          ),
          radial-gradient(
            900px 500px at 80% 0%,
            color-mix(in srgb, var(--accent2) 14%, transparent),
            transparent 62%
          ),
          var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(14px);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: var(--max);
        margin: 0 auto;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .left {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
        flex: 0 0 auto;
      }

      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel-strong) 80%, transparent);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }

      .btn:hover {
        background: color-mix(in srgb, var(--panel-strong) 100%, transparent);
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 18px 18px 80px;
      }

      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 18px 0 12px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.2px;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 12px;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: repeat(6, 1fr);
        }
      }

      @media (max-width: 560px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .tile {
        grid-column: span 4;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--panel) 100%, transparent);
        box-shadow: var(--shadow);
        overflow: hidden;
        cursor: zoom-in;
        position: relative;
      }

      @media (max-width: 980px) {
        .tile {
          grid-column: span 3;
        }
      }

      @media (max-width: 560px) {
        .tile {
          grid-column: span 2;
        }
      }

      .tile img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }

      .cap {
        padding: 10px 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .empty {
        margin-top: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--panel) 100%, transparent);
        box-shadow: var(--shadow);
        padding: 14px;
        color: var(--muted);
        line-height: 1.7;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 20;
      }

      .modal.show {
        display: flex;
      }

      .modal-inner {
        width: min(1100px, 100%);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--bg) 76%, transparent);
        backdrop-filter: blur(16px);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .modal-img {
        width: 100%;
        height: min(70vh, 720px);
        object-fit: contain;
        display: block;
        background: rgba(0, 0, 0, 0.18);
      }

      .modal-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
      }

      .modal-cap {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        min-height: 20px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: color-mix(in srgb, var(--bg) 74%, transparent);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 999px;
        backdrop-filter: blur(14px);
        font-size: 13px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 30;
      }

      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="left">
          <span class="dot" aria-hidden="true"></span>
          <a class="title" id="brand" href="../">Home</a>
        </div>
        <div class="actions">
          <button class="btn" id="themeBtn" type="button">Theme</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="header">
        <h1 id="pageTitle">Photos</h1>
        <p class="sub" id="pageSub"></p>
      </div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="empty" class="empty" hidden>
        No photos yet. Put images into the <b>/figs</b> folder and list them in
        <b>content.json</b> under <b>photos.items</b>.
      </div>
    </main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <div class="modal-inner">
        <img class="modal-img" id="modalImg" alt="" />
        <div class="modal-bar">
          <div class="modal-cap" id="modalCap"></div>
          <button class="btn" id="closeBtn" type="button">Close</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const storageKey = "solar-theme";

      const toastEl = $("#toast");
      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast._t);
        showToast._t = window.setTimeout(() => {
          toastEl.classList.remove("show");
        }, 1200);
      }

      function setTheme(mode) {
        if (!mode) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.removeItem(storageKey);
          return;
        }
        document.documentElement.setAttribute("data-theme", mode);
        localStorage.setItem(storageKey, mode);
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        setTheme(next);
        showToast(`Theme: ${next}`);
      }

      const saved = localStorage.getItem(storageKey);
      if (saved === "dark" || saved === "light") setTheme(saved);
      $("#themeBtn").addEventListener("click", toggleTheme);

      function safeText(value, fallback = "") {
        return typeof value === "string" ? value : fallback;
      }

      function resolveFromRoot(path) {
        const rootBase = new URL("../", window.location.href);
        return new URL(String(path || ""), rootBase).toString();
      }

      function openModal(src, alt, caption) {
        $("#modalImg").src = src;
        $("#modalImg").alt = alt || "";
        $("#modalCap").textContent = caption || "";
        $("#modal").classList.add("show");
      }

      function closeModal() {
        $("#modal").classList.remove("show");
        $("#modalImg").src = "";
        $("#modalImg").alt = "";
        $("#modalCap").textContent = "";
      }

      $("#closeBtn").addEventListener("click", closeModal);
      $("#modal").addEventListener("click", (e) => {
        if (e.target === $("#modal")) closeModal();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      async function loadContent() {
        const res = await fetch("../content.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load content.json (${res.status})`);
        return res.json();
      }

      (async () => {
        try {
          const data = await loadContent();
          const siteTitle = safeText(data?.site?.title, "Home");
          $("#brand").textContent = siteTitle;

          const title = safeText(data?.photos?.title, "Photos");
          document.title = `${siteTitle} · ${title}`;
          $("#pageTitle").textContent = title;

          const subtitle = safeText(data?.photos?.subtitle, "");
          $("#pageSub").textContent = subtitle;

          const items = Array.isArray(data?.photos?.items) ? data.photos.items : [];
          const grid = $("#grid");
          grid.innerHTML = "";

          for (const item of items) {
            const srcRaw = safeText(item?.src, "");
            if (!srcRaw) continue;
            const src = resolveFromRoot(srcRaw);
            const alt = safeText(item?.alt, "");
            const caption = safeText(item?.caption, "");

            const tile = document.createElement("div");
            tile.className = "tile";
            tile.tabIndex = 0;

            const img = document.createElement("img");
            img.loading = "lazy";
            img.decoding = "async";
            img.src = src;
            img.alt = alt;
            tile.appendChild(img);

            if (caption) {
              const cap = document.createElement("div");
              cap.className = "cap";
              cap.textContent = caption;
              tile.appendChild(cap);
            }

            const open = () => openModal(src, alt, caption);
            tile.addEventListener("click", open);
            tile.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") open();
            });

            grid.appendChild(tile);
          }

          $("#empty").hidden = items.length !== 0;
        } catch (err) {
          $("#empty").hidden = false;
          $("#pageSub").textContent = "Failed to load content.json.";
          console.error(err);
        }
      })();
    </script>
  </body>
</html>
