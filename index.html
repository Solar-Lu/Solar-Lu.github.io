<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Loading…</title>
    <style>
      :root {
        --bg: #06070b;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-strong: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --muted2: rgba(255, 255, 255, 0.52);
        --border: rgba(255, 255, 255, 0.14);
        --accent: #8be9fd;
        --accent2: #ff79c6;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        --radius: 18px;
        --max: 1040px;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: rgba(0, 0, 0, 0.04);
          --panel-strong: rgba(0, 0, 0, 0.06);
          --text: rgba(0, 0, 0, 0.9);
          --muted: rgba(0, 0, 0, 0.62);
          --muted2: rgba(0, 0, 0, 0.45);
          --border: rgba(0, 0, 0, 0.12);
          --accent: #2563eb;
          --accent2: #db2777;
          --shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
        }
      }

      [data-theme="dark"] {
        --bg: #06070b;
        --panel: rgba(255, 255, 255, 0.06);
        --panel-strong: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --muted2: rgba(255, 255, 255, 0.52);
        --border: rgba(255, 255, 255, 0.14);
        --accent: #8be9fd;
        --accent2: #ff79c6;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      [data-theme="light"] {
        --bg: #f6f7fb;
        --panel: rgba(0, 0, 0, 0.04);
        --panel-strong: rgba(0, 0, 0, 0.06);
        --text: rgba(0, 0, 0, 0.9);
        --muted: rgba(0, 0, 0, 0.62);
        --muted2: rgba(0, 0, 0, 0.45);
        --border: rgba(0, 0, 0, 0.12);
        --accent: #2563eb;
        --accent2: #db2777;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(
            1200px 600px at 30% 10%,
            color-mix(in srgb, var(--accent) 16%, transparent),
            transparent 55%
          ),
          radial-gradient(
            900px 500px at 80% 0%,
            color-mix(in srgb, var(--accent2) 14%, transparent),
            transparent 62%
          ),
          var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(14px);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        max-width: var(--max);
        margin: 0 auto;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .brand-text {
        font-weight: 700;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        font-size: 13px;
        color: var(--muted);
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel-strong) 80%, transparent);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
      }

      .btn:hover {
        background: color-mix(in srgb, var(--panel-strong) 100%, transparent);
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: 24px 18px 90px;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 18px;
        align-items: start;
      }

      @media (max-width: 980px) {
        .wrap {
          grid-template-columns: 1fr;
        }
      }

      .card {
        position: relative;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--panel) 100%, transparent);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .hero {
        padding: 18px;
      }

      .hero-title {
        font-size: 28px;
        line-height: 1.15;
        margin: 0 0 10px;
        letter-spacing: -0.3px;
      }

      .hero-sub {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .meta {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .aside-extra {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .text-area {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel-strong) 60%, transparent);
        color: var(--text);
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.5;
        outline: none;
      }

      .text-area:focus {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
      }

      .btn-row {
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .subtle {
        color: var(--muted2);
        font-size: 12px;
        line-height: 1.6;
        margin: 8px 0 0;
      }

      .link-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--panel-strong) 70%, transparent);
        font-size: 14px;
      }

      .link-pill::after {
        content: "↗";
        font-size: 12px;
        opacity: 0.75;
      }

      .scene {
        padding: 0;
        min-height: 380px;
      }

      .scene-inner {
        position: relative;
        height: 420px;
      }

      @media (max-width: 980px) {
        .scene-inner {
          height: 360px;
        }
      }

      canvas#solar {
        width: 100%;
        height: 100%;
        display: block;
      }

      .hint {
        position: absolute;
        bottom: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .hint span {
        font-size: 12px;
        color: var(--muted2);
        background: color-mix(in srgb, var(--bg) 70%, transparent);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 999px;
        backdrop-filter: blur(10px);
      }

      .content {
        padding: 16px;
      }

      section {
        scroll-margin-top: 64px;
      }

      .section {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 6px);
        background: color-mix(in srgb, var(--panel) 100%, transparent);
      }

      .section + .section {
        margin-top: 14px;
      }

      .h {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 10px;
      }

      .h h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.2px;
      }

      .h a {
        color: var(--muted);
        font-size: 13px;
      }

      .p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      .list {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .item {
        padding: 12px 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel-strong) 60%, transparent);
      }

      .item-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .item-title a {
        font-weight: 650;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .tag {
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 8px;
        background: color-mix(in srgb, var(--panel) 90%, transparent);
      }

      .footer {
        max-width: var(--max);
        margin: 0 auto;
        padding: 0 18px 36px;
        color: var(--muted2);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        background: color-mix(in srgb, var(--bg) 74%, transparent);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 10px 12px;
        border-radius: 999px;
        backdrop-filter: blur(14px);
        font-size: 13px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
        z-index: 8;
      }

      .toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#top" aria-label="Home">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="brand-text" id="brandText">Loading…</span>
        </a>
        <div class="actions">
          <span class="chip" id="statusChip">🚀 Loading…</span>
          <button class="btn" id="themeBtn" type="button">Theme</button>
        </div>
      </div>
    </header>

    <main id="top" class="wrap">
      <aside class="card hero">
        <h1 class="hero-title" id="title">Loading…</h1>
        <p class="hero-sub" id="tagline"></p>
        <div class="meta" id="meta"></div>
        <div class="divider"></div>
        <div class="links" id="links"></div>
        <div class="aside-extra" id="asideExtra"></div>
      </aside>

      <div class="card scene">
        <div class="scene-inner">
          <canvas id="solar" aria-label="Solar navigation" role="img"></canvas>
          <div class="hint" aria-hidden="true">
            <span>Click a planet to jump</span>
            <span>Drag to pan</span>
          </div>
        </div>
        <div class="content" id="content"></div>
      </div>
    </main>

    <footer class="footer">
      <span id="footerLeft">© <span id="year"></span></span>
      <span id="footerRight">Built for GitHub Pages · update content.json to edit</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const toastEl = $("#toast");
      const themeBtn = $("#themeBtn");
      const statusChip = $("#statusChip");
      const storageKey = "solar-theme";

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        window.clearTimeout(showToast._t);
        showToast._t = window.setTimeout(() => {
          toastEl.classList.remove("show");
        }, 1200);
      }

      function setTheme(mode) {
        if (!mode) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.removeItem(storageKey);
          return;
        }
        document.documentElement.setAttribute("data-theme", mode);
        localStorage.setItem(storageKey, mode);
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        setTheme(next);
        showToast(`Theme: ${next}`);
        if (window.__solar) window.__solar.refreshColors();
      }

      themeBtn.addEventListener("click", toggleTheme);

      const saved = localStorage.getItem(storageKey);
      if (saved === "dark" || saved === "light") setTheme(saved);

      function safeText(value, fallback = "") {
        return typeof value === "string" ? value : fallback;
      }

      function escapeHtml(input) {
        return String(input)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderLinks(links) {
        const el = $("#links");
        el.innerHTML = "";
        for (const link of Array.isArray(links) ? links : []) {
          const a = document.createElement("a");
          a.className = "link-pill";
          a.href = safeText(link.url, "#");
          a.target = "_blank";
          a.rel = "noreferrer";
          a.textContent = safeText(link.label, "Link");
          el.appendChild(a);
        }
      }

      function renderMeta(site) {
        const meta = $("#meta");
        meta.innerHTML = "";
        const items = [
          safeText(site.location),
          safeText(site.availability),
          safeText(site.email),
        ].filter(Boolean);
        for (const text of items) {
          const span = document.createElement("span");
          span.className = "chip";
          span.textContent = text;
          meta.appendChild(span);
        }
      }

      function openNewIssue({ repo, title, body, label }) {
        const repoSlug = safeText(repo).trim();
        if (!repoSlug) return;
        const params = new URLSearchParams();
        if (title) params.set("title", title);
        if (body) params.set("body", body);
        if (label) params.set("labels", label);
        const url = `https://github.com/${repoSlug}/issues/new?${params.toString()}`;
        window.open(url, "_blank", "noreferrer");
      }

      function renderAsideExtras(data) {
        const root = $("#asideExtra");
        root.innerHTML = "";

        const career = data?.career || null;
        const careerItems = Array.isArray(career?.items) ? career.items : [];
        if (career && careerItems.length) {
          const section = document.createElement("section");
          section.className = "section";

          const header = document.createElement("div");
          header.className = "h";
          const h2 = document.createElement("h2");
          h2.textContent = safeText(career.title, "Career");
          header.appendChild(h2);
          section.appendChild(header);

          const list = document.createElement("div");
          list.className = "list";
          for (const item of careerItems) {
            const card = document.createElement("div");
            card.className = "item";
            const titleRow = document.createElement("div");
            titleRow.className = "item-title";
            const name = document.createElement("span");
            name.textContent = String(item);
            name.style.fontWeight = "650";
            titleRow.appendChild(name);
            card.appendChild(titleRow);
            list.appendChild(card);
          }
          section.appendChild(list);
          root.appendChild(section);
        }

        const comments = data?.comments || null;
        if (comments?.repo) {
          const section = document.createElement("section");
          section.className = "section";

          const header = document.createElement("div");
          header.className = "h";
          const h2 = document.createElement("h2");
          h2.textContent = safeText(comments.title, "Comments");
          header.appendChild(h2);

          const view = document.createElement("a");
          view.href = `https://github.com/${safeText(comments.repo).trim()}/issues`;
          view.target = "_blank";
          view.rel = "noreferrer";
          view.textContent = "View";
          header.appendChild(view);
          section.appendChild(header);

          const p = document.createElement("p");
          p.className = "p";
          p.textContent =
            "Please Leave a suggestion...🙏🙏🙏";
          section.appendChild(p);

          const textarea = document.createElement("textarea");
          textarea.className = "text-area";
          textarea.placeholder = safeText(comments.placeholder, "Write a suggestion…");
          textarea.maxLength = 2000;
          section.appendChild(textarea);

          const row = document.createElement("div");
          row.className = "btn-row";

          const send = document.createElement("button");
          send.className = "btn";
          send.type = "button";
          send.textContent = "Send";
          send.addEventListener("click", () => {
            const message = textarea.value.trim();
            if (!message) {
              showToast("Write something first");
              textarea.focus();
              return;
            }
            const issueTitle = safeText(comments.newIssueTitle, "Suggestion");
            const body = `${message}\n\n---\nFrom: ${window.location.href}`;
            openNewIssue({
              repo: comments.repo,
              title: issueTitle,
              body,
              label: safeText(comments.label, ""),
            });
            showToast("Opening GitHub…");
          });
          row.appendChild(send);

          const hint = document.createElement("span");
          hint.className = "subtle";
          hint.textContent = `Repo: ${safeText(comments.repo)}`;
          row.appendChild(hint);

          section.appendChild(row);
          root.appendChild(section);
        }
      }

      function renderSections(sections) {
        const root = $("#content");
        root.innerHTML = "";
        for (const s of Array.isArray(sections) ? sections : []) {
          const id = safeText(s.id);
          const title = safeText(s.title);
          const body = Array.isArray(s.body) ? s.body : [];
          const items = Array.isArray(s.items) ? s.items : [];

          const section = document.createElement("section");
          section.className = "section";
          if (id) section.id = id;

          const header = document.createElement("div");
          header.className = "h";
          const h2 = document.createElement("h2");
          h2.textContent = title || "Section";
          header.appendChild(h2);

          if (id) {
            const anchor = document.createElement("a");
            anchor.href = `#${encodeURIComponent(id)}`;
            anchor.textContent = "#";
            anchor.title = "Copy link";
            anchor.addEventListener("click", (e) => {
              e.preventDefault();
              const url = new URL(window.location.href);
              url.hash = id;
              navigator.clipboard?.writeText(url.toString());
              showToast("Link copied");
              history.replaceState(null, "", `#${id}`);
            });
            header.appendChild(anchor);
          }

          section.appendChild(header);

          for (const line of body) {
            const p = document.createElement("p");
            p.className = "p";
            p.innerHTML = escapeHtml(line);
            section.appendChild(p);
          }

          if (items.length) {
            const list = document.createElement("div");
            list.className = "list";
            for (const item of items) {
              const card = document.createElement("div");
              card.className = "item";

              const titleRow = document.createElement("div");
              titleRow.className = "item-title";

              const a = document.createElement("a");
              a.href = safeText(item.url, "#");
              a.target = "_blank";
              a.rel = "noreferrer";
              a.textContent = safeText(item.name, "Untitled");
              titleRow.appendChild(a);

              card.appendChild(titleRow);

              const desc = safeText(item.description);
              if (desc) {
                const p = document.createElement("p");
                p.className = "p";
                p.style.marginTop = "8px";
                p.textContent = desc;
                card.appendChild(p);
              }

              const tags = Array.isArray(item.tags) ? item.tags : [];
              if (tags.length) {
                const tagsEl = document.createElement("div");
                tagsEl.className = "tags";
                for (const t of tags) {
                  const tag = document.createElement("span");
                  tag.className = "tag";
                  tag.textContent = String(t);
                  tagsEl.appendChild(tag);
                }
                card.appendChild(tagsEl);
              }

              list.appendChild(card);
            }
            section.appendChild(list);
          }

          root.appendChild(section);
        }
      }

      function scrollToSection(id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function getCssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function makeSolar(canvas, planets, onSelect) {
        const ctx = canvas.getContext("2d");
        const state = {
          dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
          w: 0,
          h: 0,
          t0: performance.now(),
          dragging: false,
          drag: { x: 0, y: 0 },
          offset: { x: 0, y: 0 },
          hoverIndex: -1,
          colors: null,
          reduced:
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches,
        };

        function refreshColors() {
          state.colors = {
            text: getCssVar("--text"),
            muted2: getCssVar("--muted2"),
            border: getCssVar("--border"),
            accent: getCssVar("--accent"),
            accent2: getCssVar("--accent2"),
            bg: getCssVar("--bg"),
          };
        }

        function resize() {
          const rect = canvas.getBoundingClientRect();
          state.w = Math.max(1, Math.floor(rect.width * state.dpr));
          state.h = Math.max(1, Math.floor(rect.height * state.dpr));
          canvas.width = state.w;
          canvas.height = state.h;
          refreshColors();
        }

        function toCanvasPoint(ev) {
          const rect = canvas.getBoundingClientRect();
          const x = (ev.clientX - rect.left) * state.dpr;
          const y = (ev.clientY - rect.top) * state.dpr;
          return { x, y };
        }

        function computePlanets(now) {
          const t = (now - state.t0) / 1000;
          const cx = state.w * 0.5 + state.offset.x;
          const cy = state.h * 0.5 + state.offset.y;
          const base = Math.min(state.w, state.h) * 0.34;
          const arr = [];
          const count = Math.max(1, planets.length);
          for (let i = 0; i < count; i++) {
            const p = planets[i];
            const orbit = base * (0.45 + i * 0.22);
            const speed = 0.6 + i * 0.22;
            const angle = (state.reduced ? 0.9 : t) * speed + i * 1.3;
            const x = cx + Math.cos(angle) * orbit;
            const y = cy + Math.sin(angle) * orbit * 0.72;
            const r = Math.max(10, Math.min(18, 13 + i * 1.3));
            arr.push({ ...p, x, y, r, orbit });
          }
          return { cx, cy, base, planets: arr };
        }

        function draw(now) {
          const { cx, cy, base, planets: ps } = computePlanets(now);
          const c = state.colors;
          ctx.clearRect(0, 0, state.w, state.h);

          const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * 2.2);
          bg.addColorStop(0, "rgba(255,255,255,0.05)");
          bg.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, state.w, state.h);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(1, 0.72);
          ctx.translate(-cx, -cy);
          for (const p of ps) {
            ctx.beginPath();
            ctx.strokeStyle = c.border;
            ctx.lineWidth = 1 * state.dpr;
            ctx.arc(cx, cy, p.orbit, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();

          const sunR = Math.min(38, base * 0.22);
          const sunGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, sunR * 2.2);
          sunGlow.addColorStop(0, "rgba(255, 241, 176, 0.85)");
          sunGlow.addColorStop(0.45, "rgba(255, 121, 198, 0.22)");
          sunGlow.addColorStop(1, "rgba(139, 233, 253, 0)");
          ctx.fillStyle = sunGlow;
          ctx.beginPath();
          ctx.arc(cx, cy, sunR * 2.2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(255, 241, 176, 0.92)";
          ctx.beginPath();
          ctx.arc(cx, cy, sunR, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < ps.length; i++) {
            const p = ps[i];
            const hovered = i === state.hoverIndex;
            const r = p.r * (hovered ? 1.14 : 1);
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.3);
            g.addColorStop(0, colorMix(c.accent2, c.accent, i / (ps.length + 1), 0.9));
            g.addColorStop(0.5, colorMix(c.accent, c.accent2, i / (ps.length + 1), 0.26));
            g.addColorStop(1, "rgba(0,0,0,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r * 2.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = colorMix(c.accent, c.accent2, i / (ps.length + 1), 0.92);
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "rgba(255,255,255,0.22)";
            ctx.lineWidth = 1 * state.dpr;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = c.text;
            ctx.font = `${12 * state.dpr}px ui-sans-serif, system-ui`;
            ctx.textAlign = "center";
            ctx.textBaseline = "top";
            ctx.globalAlpha = hovered ? 1 : 0.75;
            ctx.fillText(safeText(p.label, ""), p.x, p.y + r + 8 * state.dpr);
            ctx.globalAlpha = 1;
          }

          requestAnimationFrame(draw);
        }

        function colorMix(a, b, t, alpha) {
          const ra = parseRgb(a);
          const rb = parseRgb(b);
          if (!ra || !rb) return `rgba(255,255,255,${alpha})`;
          const r = Math.round(ra[0] + (rb[0] - ra[0]) * t);
          const g = Math.round(ra[1] + (rb[1] - ra[1]) * t);
          const bb = Math.round(ra[2] + (rb[2] - ra[2]) * t);
          return `rgba(${r},${g},${bb},${alpha})`;
        }

        function parseRgb(input) {
          const s = String(input).trim();
          const m1 = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
          if (m1) {
            const hex = m1[1];
            if (hex.length === 3) {
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16),
              ];
            }
            return [
              parseInt(hex.slice(0, 2), 16),
              parseInt(hex.slice(2, 4), 16),
              parseInt(hex.slice(4, 6), 16),
            ];
          }
          const m2 = s.match(/^rgba?\(([^)]+)\)$/i);
          if (m2) {
            const parts = m2[1].split(",").map((x) => Number(x.trim()));
            if (parts.length >= 3 && parts.every((n) => Number.isFinite(n))) {
              return [parts[0], parts[1], parts[2]];
            }
          }
          return null;
        }

        function pick(ev) {
          const { x, y } = toCanvasPoint(ev);
          const { planets: ps } = computePlanets(performance.now());
          for (let i = 0; i < ps.length; i++) {
            const p = ps[i];
            const dx = x - p.x;
            const dy = y - p.y;
            if (dx * dx + dy * dy <= (p.r * 1.6) * (p.r * 1.6)) return i;
          }
          return -1;
        }

        function onMove(ev) {
          if (state.dragging) {
            const pt = toCanvasPoint(ev);
            const dx = pt.x - state.drag.x;
            const dy = pt.y - state.drag.y;
            state.drag.x = pt.x;
            state.drag.y = pt.y;
            state.offset.x += dx;
            state.offset.y += dy;
            return;
          }
          const idx = pick(ev);
          if (idx !== state.hoverIndex) {
            state.hoverIndex = idx;
            canvas.style.cursor = idx >= 0 ? "pointer" : "default";
          }
        }

        function onDown(ev) {
          state.dragging = true;
          const pt = toCanvasPoint(ev);
          state.drag.x = pt.x;
          state.drag.y = pt.y;
          canvas.setPointerCapture?.(ev.pointerId);
        }

        function onUp(ev) {
          const wasDragging = state.dragging;
          state.dragging = false;
          canvas.releasePointerCapture?.(ev.pointerId);
          if (!wasDragging) return;
        }

        function onClick(ev) {
          const idx = pick(ev);
          if (idx < 0) return;
          const p = planets[idx];
          if (!p || !p.target) return;
          onSelect(p.target);
        }

        const ro = new ResizeObserver(resize);
        ro.observe(canvas);

        canvas.addEventListener("pointermove", onMove);
        canvas.addEventListener("pointerdown", onDown);
        canvas.addEventListener("pointerup", onUp);
        canvas.addEventListener("pointercancel", onUp);
        canvas.addEventListener("click", onClick);

        resize();
        requestAnimationFrame(draw);

        return {
          refreshColors,
        };
      }

      async function loadContent() {
        const res = await fetch(`./content.json?v=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`Failed to load content.json (${res.status})`);
        return res.json();
      }

      function normalizePlanets(planets, sections) {
        const sectionIds = new Set(
          (Array.isArray(sections) ? sections : []).map((s) => safeText(s.id)).filter(Boolean)
        );
        const arr = Array.isArray(planets) ? planets : [];
        const cleaned = arr
          .map((p) => ({
            label: safeText(p.label, ""),
            target: safeText(p.target, ""),
          }))
          .filter((p) => p.label && p.target && sectionIds.has(p.target));
        if (cleaned.length) return cleaned;
        const fallback = (Array.isArray(sections) ? sections : []).slice(0, 6).map((s) => ({
          label: safeText(s.title, safeText(s.id, "Section")),
          target: safeText(s.id, ""),
        }));
        return fallback.filter((p) => p.label && p.target);
      }

      function updateStatus(ok) {
        statusChip.textContent = ok ? "🪐 Ready" : "⚠️ Content load failed";
      }

      (async () => {
        $("#year").textContent = String(new Date().getFullYear());
        try {
          const data = await loadContent();
          const site = data.site || {};
          const title = safeText(site.title, "My Home");
          const tagline = safeText(site.tagline, "");

          document.title = title;
          $("#title").textContent = title;
          $("#brandText").textContent = title;
          $("#tagline").textContent = tagline;
          $("#footerLeft").firstChild.textContent = `© ${title} · `;

          renderMeta(site);
          renderLinks(data.links);
          renderAsideExtras(data);
          renderSections(data.sections);

          const planets = normalizePlanets(data.planets, data.sections);
          window.__solar = makeSolar($("#solar"), planets, (id) => {
            showToast(`Jump: ${id}`);
            scrollToSection(id);
          });

          updateStatus(true);
        } catch (err) {
          updateStatus(false);
          $("#brandText").textContent = "Solar";
          $("#title").textContent = "Solar";
          $("#tagline").textContent = "Failed to load content.json. Check the file and path.";
          showToast("Failed to load content.json");
          window.__solar = makeSolar($("#solar"), [], () => {});
          console.error(err);
        }

        const hash = decodeURIComponent(location.hash || "").replace(/^#/, "");
        if (hash) setTimeout(() => scrollToSection(hash), 60);
      })();
    </script>
  </body>
</html>
